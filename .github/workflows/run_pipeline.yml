name: HKJC Quant Pipeline Execution

on:
  workflow_dispatch:  # Keeps the manual "Run workflow" button
  schedule:
    # Runs automatically at 01:00 UTC (9:00 AM HKT) every Wednesday, Saturday, and Sunday
    - cron: '0 1 * * 0,3,6'

jobs:
  run-quant-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas psycopg2-binary

      - name: Execute Refinement Engine
        env:
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
        run: |
          python refine_pwin_engine.py
